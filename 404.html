<link rel="apple-touch-icon" href="images/profile.png">

<link rel="stylesheet" href="styles.css">

<style>
.err-wrap {
    min-height: 70vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 2rem 1rem;
}
.err-code {
    font-family: var(--display);
    font-size: clamp(6rem, 18vw, 12rem);
    font-weight: 600;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 0.5rem;
    letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums;
}
.err-title {
    font-family: var(--display);
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 0.8rem;
}
.err-msg {
    color: var(--text-soft);
    font-size: 1rem;
    max-width: 460px;
    margin: 0 auto 2rem;
    line-height: 1.6;
}
.err-actions {
    display: flex;
    gap: 0.8rem;
    justify-content: center;
    flex-wrap: wrap;
}
.err-actions a {
    padding: 0.62rem 1.25rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease),
                background-color var(--t-fast) var(--ease), transform 0.2s var(--ease);
}
.err-actions a:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
}
.err-actions a:active { transform: scale(0.97); }
.err-actions a.primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
}
.err-actions a.primary:hover {
    background: var(--accent-d);
    color: var(--bg);
}
</style>
</head>
<body>


<nav class="nav" data-page="home"></nav>

<main>
    <section class="err-wrap">
        <div>
            <p class="err-code">404</p>
            <h1 class="err-title">This page seems to have aggregated</h1>
            <p class="err-msg">The link is broken, the page moved, or it never existed in the first place. Catching false positives is kind of my thing, so let's get you back to a real page.</p>
            <div class="err-actions">
                <a href="/abdallahabouhajal/" class="primary">Home</a>
                <a href="/abdallahabouhajal/publications.html">Publications</a>
                <a href="/abdallahabouhajal/about.html">About</a>
                <a href="/abdallahabouhajal/projects.html">Projects</a>
            </div>
        </div>
    </section>
</main>

<footer data-bind="footer"></footer>

<script src="scripts.js"></script>
<script src="motion.js" defer></script>
</body>
</html>
